name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all sources
        run: python -m compileall -q core ui agent main.py scripts tests

      - name: Run benchmark suite (smoke)
        run: python -m core.bench_worker

      - name: Run end-to-end loop + governance tests
        # The suite needs a git identity to build throwaway repos.
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          python tests/test_loop.py
